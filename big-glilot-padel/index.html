<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פאדל גלילות</title>
<meta name="description" content="4 מקומות במגרש הפאדל, כל שבוע, לעובדי BIG גלילות.">
<meta name="theme-color" content="#EDEDEB">
<link rel="icon" type="image/png" sizes="32x32" href="/portfolio-images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/portfolio-images/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/portfolio-images/favicon-192.png">
<meta property="og:title" content="פאדל גלילות">
<meta property="og:description" content="4 מקומות במגרש. כל הקודם זוכה.">
<meta property="og:image" content="https://autoscalehq.io/big-glilot-padel/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta property="og:url" content="https://autoscalehq.io/big-glilot-padel/">
<meta name="twitter:card" content="summary_large_image">
<style>
/* ══════════════════════════════════════════════════════════════
   צבע מותג אחד: האדום של BIG. משנים כאן והכל משתנה איתו.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#E4002B;            /* אדום BIG */
  --ink-press:#B4001F;
  --on-ink:#FFFFFF;

  --bg:#EDEDEB;
  --card:#FFFFFF;
  --text:#0B0B0B;
  --text-2:#6F6F6C;
  --text-3:#A5A5A1;
  --line:#E2E2DF;
  --court:#DFDFDB;          /* קווי המגרש ברקע, גוון אחד מתחת לרקע */
  --fill-hover:rgba(0,0,0,.035);

  --r-block:12px;
  --r-pill:9px;
  --r-round:999px;   /* למדליות ולמתג בלבד */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FF3355; --ink-press:#E01238; --on-ink:#FFFFFF;
    --bg:#0B0B0B; --card:#161615; --text:#F5F5F3; --text-2:#9C9C98; --text-3:#6B6B67;
    --line:#262625; --fill-hover:rgba(255,255,255,.05);
    --court:#1A1A19;
  }
}
:root[data-theme="dark"]{
  --ink:#FF3355; --ink-press:#E01238; --on-ink:#FFFFFF;
  --bg:#0B0B0B; --card:#161615; --text:#F5F5F3; --text-2:#9C9C98; --text-3:#6B6B67;
  --line:#262625; --fill-hover:rgba(255,255,255,.05);
  --court:#1A1A19;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:400 17px/1.35 var(--font);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2{margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;
  -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.wrap{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:0 14px;position:relative}

/* על מסך גדול נשארים ברוחב טלפון, אבל בתוך מסגרת נקייה */
@media (min-width:560px){
  body{padding:32px 0}
  .credit{margin-top:18px}
  .wrap{min-height:auto;background:var(--bg);border-radius:16px;padding:0 16px 8px;
    backdrop-filter:blur(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 24px 60px -28px rgba(0,0,0,.35);
    outline:1px solid var(--line)}
}

/* ── קווי המגרש על כל הרקע, באותו גוון של הרקע ────────────── */
.page-court{position:fixed;inset:-14px;z-index:-2;color:var(--court);pointer-events:none}
.page-court svg{width:100%;height:100%}

/* ── סרגל מותג ────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;padding:16px 6px 14px}
.bar-txt{font-size:12.5px;font-weight:600;color:var(--text-2);flex:1;min-width:0}

/* הלוגו של BIG FASHION גלילות */
.logo{height:46px;width:auto;flex:none;display:block;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* מתג מצב כהה */
.theme{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:var(--r-pill);
  color:var(--text-2);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .12s ease,color .15s ease}
.theme:active{transform:scale(.92)}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}

/* ── בלוק המשחק, עם קווי המגרש ברקע ──────────────────────── */
.hero{background:var(--ink);color:var(--on-ink);border-radius:var(--r-block);
  padding:20px 22px 22px;position:relative;overflow:hidden;isolation:isolate}
.hero > *{position:relative}
.court-art{position:absolute;z-index:-1;inset:auto -12% -18% auto;width:118%;height:auto;
  opacity:.17;color:currentColor;transform:rotate(-7deg);pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  .court-art{animation:court 1.1s var(--ease) both}
}
@keyframes court{from{opacity:0;transform:rotate(-7deg) scale(1.08)}
  to{opacity:.17;transform:rotate(-7deg) scale(1)}}
.hero .day{font-size:14px;font-weight:700;opacity:.75;letter-spacing:.01em}
.hero .time{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1;
  margin-top:7px;font-variant-numeric:tabular-nums}
.hero .court{margin-top:9px;font-size:14px;opacity:.6}
.hero .left{margin-top:11px;font-size:14px;font-weight:600;opacity:.85}

/* ── רשימת השחקנים ────────────────────────────────────────── */
.group{margin:22px 6px 8px;font-size:12.5px;color:var(--text-2);font-weight:600}
.list{background:var(--card);border-radius:var(--r-block);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:11px 18px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.who{flex:1;min-width:0;font-size:19px;font-weight:600;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[data-state="open"] .who{color:var(--text-3);font-weight:500}
.row[data-state="claimed"] .who{color:var(--text);font-weight:700}
.row[data-state="soon"] .who{color:var(--text-3);font-weight:500}
.gm .row[data-state="soon"]{opacity:.75}
.tag{font-size:13px;color:var(--text-3);font-weight:600}
.tag.mine{color:var(--ink);font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:var(--r-pill);padding:5px 11px}

.take.free{background:transparent;color:var(--ink);font-size:13.5px;
  box-shadow:inset 0 0 0 1.5px var(--ink)}
.take.free:active{background:transparent;color:var(--ink-press)}
.sure{display:flex;align-items:center;gap:7px;animation:in .28s var(--ease) both}
.sure span{font-size:13.5px;font-weight:700;color:var(--text-2)}
.sure-yes,.sure-no{font-size:13.5px;font-weight:800;padding:9px 14px;
  border-radius:var(--r-pill);min-height:38px;transition:transform .1s ease}
.sure-yes{background:var(--ink);color:var(--on-ink)}
.sure-no{color:var(--text-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.sure-yes:active,.sure-no:active{transform:scale(.94)}
.tag.as-btn{cursor:pointer;transition:opacity .15s ease}
.tag.as-btn:active{opacity:.45}
.take{background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:700;
  padding:10px 16px;border-radius:var(--r-pill);min-height:40px;
  transition:transform .1s ease,opacity .15s ease}
.take:active{transform:scale(.95);background:var(--ink-press)}
@media (hover:hover){
  .row[data-state="open"],.row[data-state="claimed"],.row[data-state="mine"]{cursor:pointer}
  .row:hover{background:var(--fill-hover)}
  .row[data-state="open"]:hover .take{background:var(--ink-press)}
  .row[data-state="open"]:hover .who{color:var(--text)}
  .filled:hover,.hollow:hover,.seg:hover,.theme:hover{filter:brightness(.97)}
  .theme:hover{color:var(--text)}
}

@media (prefers-reduced-motion: no-preference){
  .list .row{animation:in .42s var(--ease) both;animation-delay:calc(var(--i) * 50ms)}
  .mk{animation:pop .45s var(--ease) both}
}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

/* ── כפתורים ──────────────────────────────────────────────── */
.filled{width:100%;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:700;
  min-height:56px;border-radius:var(--r-pill);margin-top:18px;
  transition:transform .1s ease,opacity .15s ease}
.filled:active{transform:scale(.985);background:var(--ink-press)}
.filled:disabled{opacity:.35;transform:none;cursor:default}
.hollow{width:100%;background:transparent;color:var(--text);font-size:16px;font-weight:600;
  min-height:52px;border-radius:var(--r-pill);margin-top:10px;
  box-shadow:inset 0 0 0 1.5px var(--line)}
.hollow:active{background:var(--card)}
.plain{width:100%;color:var(--text-2);font-size:15px;font-weight:600;min-height:44px;margin-top:6px}
.plain:active{opacity:.5}

/* ── ההודעה כשאין מקומות בכלל ─────────────────────────────── */
.reopen{margin:-2px 6px 10px;font-size:13.5px;color:var(--text-2);line-height:1.45}

/* ── כרטיס משחק: כותרת עם יום ושעה, ומתחתיה ארבעת המקומות ── */
.gm{margin-top:18px}
.gm-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:0 6px 7px}
.gm-when{font-size:15px;font-weight:800;letter-spacing:-.01em}
.gm-tag{font-size:12.5px;font-weight:700;color:var(--text-2)}
.gm.past{opacity:.5}
.gm.past .gm-tag{color:var(--text-3)}
@media (prefers-reduced-motion: no-preference){
  .gm{animation:in .42s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
}

/* ── מסך קוד הכניסה ───────────────────────────────────────── */
.gate{background:var(--card);border-radius:var(--r-block);padding:26px 20px 22px;
  margin-top:22px;text-align:center}
.gate h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.gate > p{margin-top:7px;font-size:14px;color:var(--text-2);line-height:1.4}
.code-in{display:block;width:100%;box-sizing:border-box;margin:20px 0 0;
  font:700 32px/1 var(--font);text-align:center;letter-spacing:.4em;text-indent:.4em;
  font-variant-numeric:tabular-nums;padding:18px 0;border:0;border-radius:var(--r-pill);
  background:var(--bg);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:box-shadow .15s ease}
.code-in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--ink)}
.code-in::placeholder{color:var(--text-3)}
.gate .hint{margin:12px 0 0;text-align:center}
.gate .hint.bad{color:var(--ink);font-weight:700}

/* ── טופס ─────────────────────────────────────────────────── */
.fields{background:var(--card);border-radius:var(--r-block);overflow:hidden}
.f{display:flex;align-items:center;gap:12px;padding:6px 18px;position:relative}
.f + .f::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.f label{width:64px;flex:none;font-size:14px;color:var(--text-2);font-weight:600}
.f input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;border:0;
  background:transparent;color:var(--text);padding:16px 0;min-height:52px;letter-spacing:-.01em}
.f input::placeholder{color:var(--text-3);font-weight:500}
.f input:focus{outline:none}
.f input.field-bad{box-shadow:inset 0 0 0 2px var(--ink);border-radius:8px}
.hint{margin:9px 6px 0;font-size:13px;color:var(--text-2);line-height:1.4;
  transition:color .18s ease}
.hint.bad{color:var(--ink);font-weight:800;font-size:14px;
  background:color-mix(in srgb, var(--ink) 10%, transparent);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 45%, transparent);
  border-radius:10px;padding:11px 13px;margin:12px 0 0;line-height:1.45}
@media (prefers-reduced-motion: no-preference){
  .hint.bad{animation:nudge .42s cubic-bezier(.36,.07,.19,.97) both}
}
@keyframes nudge{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-6px)} 30%{transform:translateX(5px)}
  45%{transform:translateX(-3px)} 60%{transform:translateX(2px)}
}

/* ── מסך אישור ────────────────────────────────────────────── */
.done{padding:8px 6px 0}
.mk{width:54px;height:54px;border-radius:var(--r-round);background:var(--ink);color:var(--on-ink);
  display:grid;place-items:center;font-size:26px;font-weight:600}

.done h2{margin-top:18px;font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.02}
@media (prefers-reduced-motion: no-preference){
  .done h2{animation:in .5s var(--ease) both;animation-delay:.08s}
  .done p{animation:in .5s var(--ease) both;animation-delay:.16s}
  .done .filled{animation:in .5s var(--ease) both;animation-delay:.24s}
}
.done p{margin-top:12px;font-size:16px;color:var(--text-2);line-height:1.45;max-width:31ch}

/* כפתור בהמתנה: הטקסט מוחלף בכדור קטן שמקפץ.
   הרוחב נשמר כדי שהכפתור לא יקפוץ. */
.btn-busy{position:relative;color:transparent!important;pointer-events:none}
.btn-busy .bball{position:absolute;inset:0;display:grid;place-items:center}
.btn-busy .bball svg{width:22px;height:22px;color:var(--on-ink)}
.hollow.btn-busy .bball svg,.take.free.btn-busy .bball svg{color:var(--ink)}
@media (prefers-reduced-motion: no-preference){
  .btn-busy .bball svg{animation:bounce .58s cubic-bezier(.32,0,.68,1) infinite alternate}
}

/* ── כדור פאדל מקפץ, לכל רגע של המתנה ────────────────────── */
.loader{display:grid;place-items:center;gap:9px;padding:44px 0 40px}
.loader .ball{width:36px;height:36px;display:block;color:var(--ink)}
.loader .sh{width:30px;height:5px;border-radius:50%;background:var(--text-3);opacity:.22}
.loader .cap{font-size:13px;color:var(--text-2);margin-top:4px}
@media (prefers-reduced-motion: no-preference){
  .loader .ball{animation:bounce .62s cubic-bezier(.32,0,.68,1) infinite alternate}
  .loader .sh{animation:shrink .62s cubic-bezier(.32,0,.68,1) infinite alternate}
}
@keyframes bounce{
  from{transform:translateY(-30px) scale(1.02,.98)}
  to{transform:translateY(0) scale(.94,1.06)}
}
@keyframes shrink{from{transform:scaleX(.6);opacity:.12}to{transform:scaleX(1);opacity:.26}}

/* אותו כדור, קטן, בתוך עיגול ההמתנה של תפיסת מקום */
.mk.waiting{background:transparent;box-shadow:none;padding:0}
.mk.waiting .ball{width:34px;height:34px;color:var(--ink);display:block}
@media (prefers-reduced-motion: no-preference){
  .mk.waiting .ball{animation:bounce .62s cubic-bezier(.32,0,.68,1) infinite alternate}
}

/* ── שלד: אותו מבנה של כרטיס משחק, עם ברק שעובר עליו ─────── */
.sk-wrap{animation:skfade .3s var(--ease) both}
@keyframes skfade{from{opacity:0}to{opacity:1}}
.sk-gm{margin-top:18px}
.sk-head{display:flex;justify-content:space-between;align-items:center;margin:0 6px 7px}
.sk-line{border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.sk-line.w1{width:132px;height:14px}
.sk-line.w2{width:58px;height:12px}
.sk-list{background:var(--card);border-radius:var(--r-block);overflow:hidden}
.sk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:62px;padding:11px 18px;position:relative}
.sk-row + .sk-row::before{content:"";position:absolute;top:0;inset-inline-start:18px;
  inset-inline-end:0;height:1px;background:var(--line)}
.sk-name{width:118px;height:17px;border-radius:5px;background:var(--line)}
.sk-btn{width:96px;height:40px;border-radius:var(--r-pill);background:var(--line)}

/* הברק. שכבה אחת שעוברת על כל השלד, לא על כל פריט בנפרד */
@media (prefers-reduced-motion: no-preference){
  .sk-wrap{position:relative;overflow:hidden}
  .sk-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 20%,
      color-mix(in srgb, var(--card) 85%, transparent) 45%,transparent 70%);
    transform:translateX(-100%);animation:sweep 1.4s ease-in-out infinite}
}
@keyframes sweep{to{transform:translateX(100%)}}

/* ── שלד טעינה ────────────────────────────────────────────── */
.sk{min-height:62px;padding:22px 18px;position:relative}
.sk + .sk::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.sk i{display:block;width:132px;height:18px;border-radius:5px;background:var(--line)}
@media (prefers-reduced-motion: no-preference){
  .sk i{animation:breathe 1.4s ease-in-out infinite}
}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}

/* ── חלון: אותו כרטיס לכל המסכים ──────────────────────────── */
.mscrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{position:fixed;z-index:61;inset-inline:0;bottom:0;padding:0 12px 12px;
  display:flex;justify-content:center;pointer-events:none}
.modal .card{pointer-events:auto}
@media (min-height:620px){
  .modal{top:0;align-items:center;padding:16px 12px}
}
.card{width:100%;max-width:398px;background:var(--bg);border-radius:14px;
  padding:14px 18px 20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.55);
  outline:1px solid var(--line);will-change:transform}
.card h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
.card.tall{padding:14px 14px 16px}
.grab{padding:2px 0 12px;display:grid;place-items:center;touch-action:none;cursor:grab;
  margin:0 -18px 2px}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--text-3);opacity:.5;display:block}
.grab:active{cursor:grabbing}
.card .sub{margin-top:4px;font-size:13.5px;color:var(--text-2);font-weight:600}
.scroller{max-height:min(52dvh,400px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
.segs{display:flex;gap:5px;margin:0 0 10px}
.seg{flex:1;font-size:14px;font-weight:700;color:var(--text-2);padding:9px 10px;
  border-radius:var(--r-pill);background:var(--card);
  transition:background .18s ease,color .18s ease,transform .1s ease}
.seg[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.seg:active{transform:scale(.97)}
@media (prefers-reduced-motion: no-preference){
  .mscrim{animation:fade .2s ease both}
  .card{animation:rise .32s var(--ease) both}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ── לוג השבועות והמובילים ────────────────────────────────── */

.wk{padding:14px 18px;position:relative}
.wk + .wk::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.wk-date{font-size:12.5px;color:var(--text-3);font-weight:600;
  font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:start}
.wk-names{margin-top:5px;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.4}

.lb{display:flex;align-items:center;gap:12px;padding:13px 18px;position:relative}
.lb + .lb::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.lb-rank{font-size:13px;color:var(--text-3);font-weight:700;min-width:16px;
  font-variant-numeric:tabular-nums}
.lb-name{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

<script>
/* ══════════════════════════════════════════════════════════════
   1. כתובת השרת. מדביקים כאן את ה־Web app URL של Apps Script.

const API = "https://script.google.com/macros/s/AKfycbxWfc-vhxaV72MKJ7M6aN2aVcKJzZ-BonTuGhyb_NzIaAxtCNvkpTDUgx0TRwKqQAv-Uw/exec";

/* ══════════════════════════════════════════════════════════════
   2. המשחק הקבוע. אותם ערכים גם ב־SESSION שבקובץ Code.gs.
   ══════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════
   2. לוח המשחקים. חייב להיות זהה ל־GAMES שבקובץ Code.gs.
   ══════════════════════════════════════════════════════════════ */
const GAMES = [
  {day: "שלישי", start: "20:00", end: "21:00"},
  {day: "שלישי", start: "21:00", end: "22:00"},
  {day: "רביעי", start: "20:00", end: "21:00"},
  {day: "רביעי", start: "21:00", end: "22:00"}
];
const COURT = "מגרש הפאדל";
const PLACE = "ביג פאשן גלילות";
const RESET_AFTER = 2;         // דקות אחרי תחילת משחק שבהן הוא נסגר
/* מתי נפתחת ההרשמה. חייב להיות זהה ל־OPENS שבקובץ Code.gs. */
const OPENS = {day: "ראשון", time: "12:00"};

const app    = document.getElementById("app");
const leftEl = {set textContent(v){}};   /* המונה מוצג מעל הרשימה בלבד */
const params = new URLSearchParams(location.search);
const linkToken = params.get("c");
const STORE = "padel-glilot-token";
const CODE  = "padel-glilot-code";
const DSTATE = "padel-glilot-demo";
const SNAP   = "padel-glilot-snapshot";
const XSNAP  = "padel-glilot-board";
const ME    = "padel-glilot-me";

let games = [], demoMode = false, myToken = null, opensInfo = null;
let accessCode = "";
try{ accessCode = localStorage.getItem(CODE) || ""; }catch(e){}

/* תמונת המצב האחרונה נשמרת במכשיר, כדי שהדף ייפתח מיד
   ולא ימתין לשרת. מיד אחריה נמשך המצב האמיתי ומתעדכן. */
function saveSnap(list){
  try{ localStorage.setItem(SNAP, JSON.stringify({t: Date.now(), list: list})); }catch(e){}
}
function loadSnap(){
  try{
    const raw = JSON.parse(localStorage.getItem(SNAP));
    if(raw && Array.isArray(raw.list) && Date.now() - raw.t < 36e5) return raw.list;
  }catch(e){}
  return null;
}

/* מסמן את המקום שנתפס מהמכשיר הזה */
function normalise(list){
  return (list || []).map(g => Object.assign({}, g, {
    spots: (g.spots || []).map(sp => Object.assign({}, sp, {mine: false}))
  }));
}

/* כדור פאדל מצויר, משמש בכל מצבי ההמתנה */
const BALL =
  '<svg class="ball" viewBox="0 0 40 40" aria-hidden="true">' +
    '<circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2.6"></circle>' +
    '<path d="M6 12a20 20 0 0 0 0 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path>' +
    '<path d="M34 12a20 20 0 0 1 0 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></path>' +
  "</svg>";

/* שלד בצורת הדף האמיתי. ככה העין כבר יודעת לאן להסתכל
   לפני שהנתונים הגיעו, והמעבר לתוכן לא קופץ. */
/* מכניס כדור מקפץ לתוך כפתור, במקום להחליף את הטקסט למילה */
function busy(btn, on){
  if(!btn) return;
  if(on){
    btn.dataset.label = btn.dataset.label || btn.textContent;
    btn.classList.add("btn-busy");
    btn.disabled = true;
    if(!btn.querySelector(".bball")){
      const w = document.createElement("span");
      w.className = "bball"; w.innerHTML = BALL;
      btn.appendChild(w);
    }
  }else{
    btn.classList.remove("btn-busy");
    btn.disabled = false;
    const w = btn.querySelector(".bball");
    if(w) w.remove();
    if(btn.dataset.label) btn.textContent = btn.dataset.label;
  }
}

const nameKey = v => String(v || "").replace(/\s+/g, " ").trim().toLowerCase();

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const remember = t => { try{ localStorage.setItem(STORE, t); }catch(e){} };
const recall   = ()  => { try{ return localStorage.getItem(STORE); }catch(e){ return null; } };
const forget   = ()  => { try{ localStorage.removeItem(STORE); }catch(e){} };

/* פרטי העובד נשמרים במכשיר שלו בלבד, כדי שבפעם הבאה הטופס כבר מלא. */
const saveMe = (name, phone) => {
  try{ localStorage.setItem(ME, JSON.stringify({name:name, phone:phone})); }catch(e){}
};
const loadMe = () => {
  try{ return JSON.parse(localStorage.getItem(ME)) || {}; }catch(e){ return {}; }
};

/* JSONP, כדי שלא תידרש הגדרת CORS בצד של Apps Script. */
function api(action, data){
  data = data || {};
  return new Promise((resolve, reject) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const cleanup = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    window[cb] = res => { cleanup(); resolve(res); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    const q = Object.assign({action:action, callback:cb}, data);
    if(accessCode) q.code = accessCode;
    s.src = API + "?" + new URLSearchParams(q).toString();
    document.body.appendChild(s);
  });
}

const DAYS = {"ראשון":0,"שני":1,"שלישי":2,"רביעי":3,"חמישי":4,"שישי":5,"שבת":6};

/* מתי מתקיים משחק מסוים, בפעם הקרובה. אותו כלל כמו בשרת. */
function dateOf(game){
  const now = new Date();
  const p = game.start.split(":");
  const d = new Date(now);
  d.setHours(Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
  d.setDate(d.getDate() + (((DAYS[game.day] || 0) - d.getDay() + 7) % 7));
  if(now > new Date(d.getTime() + RESET_AFTER * 60000)) d.setDate(d.getDate() + 7);
  return d;
}
const dm = d => d.getDate() + "." + (d.getMonth() + 1);

/* ── קובץ יומן אחד שמתאים לאייפון, לאנדרואיד ולגוגל ────────── */
function pad2(n){ return String(n).padStart(2, "0"); }
function stamp(d){
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) +
         "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
}
function addToCalendar(opts){
  const end = new Date(opts.start.getTime() + (opts.minutes || 60) * 60000);
  const alarms = (opts.alarms || []).map(a =>
    ["BEGIN:VALARM",
     "ACTION:DISPLAY",
     "DESCRIPTION:" + a.text,
     "TRIGGER;VALUE=DATE-TIME:" + stamp(a.at),
     "END:VALARM"].join("\r\n"));

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//AutoScale//Padel Glilot//HE",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "-padel@autoscalehq.io",
    "DTSTAMP:" + stamp(new Date()),
    "DTSTART:" + stamp(opts.start),
    "DTEND:" + stamp(end),
    "SUMMARY:" + opts.title,
    "LOCATION:" + (opts.place || GAME.place),
    "DESCRIPTION:" + (opts.note || ""),
    ...alarms,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], {type: "text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (opts.file || "padel") + ".ics";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* המשחק עצמו: תזכורת ביום המשחק ב־09:00, ועוד אחת ערב קודם ב־18:00 */
function calendarForGame(game){
  const start = dateOf(game);
  const sameDay9 = new Date(start); sameDay9.setHours(9, 0, 0, 0);
  const dayBefore18 = new Date(start);
  dayBefore18.setDate(dayBefore18.getDate() - 1);
  dayBefore18.setHours(18, 0, 0, 0);

  const alarms = [{at: dayBefore18, text: "מחר משחק פאדל בגלילות"}];
  if(sameDay9 < start) alarms.unshift({at: sameDay9, text: "היום משחק פאדל בגלילות"});

  addToCalendar({
    title: "משחק פאדל - ביג גלילות",
    start: start, minutes: 60,
    place: COURT + ", " + PLACE,
    note: "המקום שלכם במגרש. אם לא תוכלו להגיע, שחררו אותו כאן: " + location.href,
    alarms: alarms,
    file: "padel-glilot"
  });
}

/* למי שלא הספיק: תזכורת להירשם רגע לפני שנפתח השבוע הבא */
function calendarForNextOpening(){
  // הרגע שבו נפתחת ההרשמה הבאה: היום והשעה הקבועים שב־OPENS
  const now = new Date();
  const p = OPENS.time.split(":");
  const opens = new Date(now);
  opens.setHours(Number(p[0]) || 0, Number(p[1]) || 0, 0, 0);
  opens.setDate(opens.getDate() + (((DAYS[OPENS.day] || 0) - opens.getDay() + 7) % 7));
  if(now > opens) opens.setDate(opens.getDate() + 7);
  const remind = new Date(opens.getTime() - 2 * 60000);
  addToCalendar({
    title: "להירשם לפאדל של שבוע הבא",
    start: opens, minutes: 15,
    place: PLACE,
    note: "המקומות נפתחים עכשיו. מי שראשון תופס: " + location.href,
    alarms: [{at: remind, text: "עוד שתי דקות נפתחת ההרשמה לפאדל"}],
    file: "padel-reminder"
  });
}

function paintHero(){
  const days = [];
  GAMES.forEach(g => { if(days.indexOf(g.day) < 0) days.push(g.day); });
  const dates = GAMES.map(dateOf);
  const first = dates.reduce((a, b) => a < b ? a : b);
  const last  = dates.reduce((a, b) => a > b ? a : b);
  document.getElementById("gDay").textContent =
    days.join(" ו") + " · " + dm(first) + (dm(first) === dm(last) ? "" : " עד " + dm(last));
  document.getElementById("gTime").textContent =
    GAMES[0].start + " עד " + GAMES[GAMES.length - 1].end;
  document.getElementById("gCourt").textContent =
    COURT + " · " + GAMES.length + " משחקים, " + (GAMES.length * 4) + " מקומות";
}

/* ── ארבעת המקומות ────────────────────────────────────────── */
function renderSpots(alertText){
  onList = true;
  let open = 0, mine = null, mineGame = null;
  games.forEach(g => g.spots.forEach(sp => {
    if(sp.status === "open" && !g.closed) open++;
    if(sp.mine){ mine = sp; mineGame = g; }
  }));

  const allPast = games.length && games.every(g => g.closed);
  const notOpen = games.length && (games[0].notOpen || allPast);
  const headline = notOpen ? "ההרשמה נפתחת ביום " + OPENS.day + " בשעה " + OPENS.time
    : mine ? "אתם רשומים ל" + mineGame.day + " " + mineGame.start
    : open === 1 ? "נשאר מקום אחד"
    : open > 1  ? "נשארו " + open + " מקומות"
    : "לשבוע הבא אפשר יהיה להירשם ביום " + OPENS.day + " בשעה " + OPENS.time;

  // כשאין אף מקום, אומרים בדיוק מתי נפתחת ההרשמה הבאה:
  // שתי דקות אחרי שהמשחק הראשון של השבוע מתחיל.
  const reopenLine = notOpen
    ? "המקומות לשלישי ולרביעי הקרובים ייפתחו יחד" +
      (opensInfo && opensInfo.date ? " · " + opensInfo.date : "")
    : "";

  app.innerHTML =
    (alertText ? '<div class="hint bad" style="margin:16px 6px 0">' + esc(alertText) + "</div>" : "") +
    '<div class="group">' + esc(headline) + "</div>" +
    (reopenLine ? '<div class="reopen">' + esc(reopenLine) + "</div>" : "") +
    games.map((g, gi) => {
      const free = g.spots.filter(sp => sp.status === "open").length;
      const tag = g.notOpen ? "נפתח ביום " + OPENS.day
        : g.closed ? "המשחק כבר היה"
        : free === 0 ? "מלא" : free + " פנויים";
      return '<div class="gm' + (g.closed ? " past" : "") + '" style="--i:' + gi + '">' +
        '<div class="gm-head">' +
          '<span class="gm-when">' + esc(g.day) + " " + esc(g.start) + " עד " + esc(g.end) + "</span>" +
          '<span class="gm-tag">' + esc(tag) + "</span>" +
        "</div>" +
        '<div class="list">' + g.spots.map((sp, i) => {
          const state = sp.mine ? "mine" : sp.status;
          return '<div class="row" data-state="' + state + '" style="--i:' + i + '">' +
            '<span class="who">' +
              (sp.status === "soon" ? "טרם נפתח"
               : sp.status === "open" ? (g.closed ? "לא נתפס" : "פנוי")
               : esc(sp.name)) + "</span>" +
            (sp.status === "soon" || g.closed ? ""
              : sp.mine ? '<button class="take free" data-drop="1">שחרור</button>'
              : sp.status === "open" ? '<button class="take" data-take="' + esc(sp.id) + '">אני משחק</button>'
              : '<button class="tag as-btn" data-free="' + esc(sp.id) + '">ביטול</button>') +
          "</div>";
        }).join("") + "</div>" +
      "</div>";
    }).join("");

  const remind = document.getElementById("remindMe");
  if(remind) remind.hidden = !!mine;
  const openLog = document.getElementById("openLog");
  if(openLog) openLog.hidden = false;
}

/* מוצא מקום ואת המשחק שלו לפי מזהה */
function findSpot(id){
  for(const g of games){
    const sp = g.spots.find(x => String(x.id) === String(id));
    if(sp) return {spot: sp, game: g};
  }
  return null;
}

/* ── לחיצות ברשימה. כל השורה היא היעד, לא רק הכפתור. ──────── */
app.addEventListener("click", e => {
  if(e.target.closest("[data-sure]")) return;         // האישור מטפל בעצמו

  const drop = e.target.closest("[data-drop]") ||
               (e.target.closest('.row[data-state="mine"]') &&
                e.target.closest(".row").querySelector("[data-drop]"));
  if(drop){ confirmRelease(drop); return; }

  const takeRow = e.target.closest('.row[data-state="open"]');
  if(takeRow){
    const btn = takeRow.querySelector("[data-take]");
    const hit = btn && findSpot(btn.dataset.take);
    if(hit) renderForm(hit.spot, hit.game);
    return;
  }

  const freeRow = e.target.closest('.row[data-state="claimed"]');
  if(freeRow){
    const btn = freeRow.querySelector("[data-free]");
    const hit = btn && findSpot(btn.dataset.free);
    if(hit) renderRelease(hit.spot);
  }
});

const modal  = document.getElementById("modal");
const mscrim = document.getElementById("mscrim");

function openModal(html, opts){

    '<div class="grab" aria-hidden="true"><i></i></div>' + html + "</div>";

  cardY = 0; mscrim.style.opacity = "1";
  const c = modal.querySelector(".card");
  if(c){ c.style.transform = "translateY(0px)"; cardH = c.offsetHeight; }

  if(first) setTimeout(() => first.focus(), 60);
}

function closeModal(){
  modal.hidden = true; mscrim.hidden = true; modal.innerHTML = "";
}

mscrim.addEventListener("click", () => { closeModal(); renderSpots(); });
document.addEventListener("keydown", e => {

});

/* ── שער הכניסה. הקוד נבדק בשרת, לא בדף. ──────────────────── */
function renderGate(msg){
  const log = document.getElementById("openLog");
  const remind = document.getElementById("remindMe");
  if(log) log.hidden = true;
  if(remind) remind.hidden = true;

  app.innerHTML =
    '<div class="gate">' +
      "<h2>קוד כניסה</h2>" +
      "<p>הקוד מחולק לעובדי הקניון.</p>" +
      '<input id="code" class="code-in" type="text" inputmode="numeric" ' +
        'maxlength="4" autocomplete="one-time-code" placeholder="0000">' +
      '<div class="hint' + (msg ? " bad" : "") + '" id="ghint">' +
        esc(msg || "ארבע ספרות, וזהו.") + "</div>" +
      '<button class="filled" id="enter">כניסה</button>' +
    "</div>";

  const input = document.getElementById("code");
  const hint  = document.getElementById("ghint");
  const btn   = document.getElementById("enter");
  let busyFlag = false;
  setTimeout(() => input.focus(), 80);

  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    if(input.value.length === 4) enter();
  });
  btn.onclick = enter;

  async function enter(){
    const v = input.value.trim();
    if(v.length !== 4 || busyFlag) return;
    busy = true;
    busy(btn, true);
    hint.className = "hint"; hint.textContent = "";

    accessCode = v;
    let res = null, offline = false;
    try{
      res = await api("ping");
      if(res && !res.ok && res.reason === "unknown_action") res = await api("list");
    }catch(e){ offline = true; }

    if(res && res.ok){
      try{ localStorage.setItem(CODE, v); }catch(e){}
      if(log) log.hidden = false;
      if(res.games) return boot(res);
      try{
        const list = await api("list");
        if(list && list.ok) return boot(list);
      }catch(e){}
      return fail();
    }

    accessCode = "";
    busyFlag = false;
    busy(btn, false);
    input.value = ""; input.focus();
    hint.className = "hint";
    void hint.offsetWidth;
    hint.className = "hint bad";
    hint.textContent = offline ? "שגיאה, נסו שוב." : "קוד שגוי.";
    try{ navigator.vibrate && navigator.vibrate([12, 60, 12]); }catch(e){}
  }
}

/* ── טעינת המשחקים אחרי כניסה מוצלחת ──────────────────────── */
async function boot(listRes){
  games = normalise(listRes.games);
  if(games.length) saveSnap(listRes.games);
  if(!games.length){
    // עדיין אותו דף, רק שהמקומות מסומנים כלא פתוחים
    opensInfo = listRes.opens || OPENS;
    games = GAMES.map((g, i) => ({
      game: i + 1, day: g.day, start: g.start, end: g.end,
      date: dm(dateOf(g)), closed: false, notOpen: true,
      spots: [1,2,3,4].map(n => ({id: "soon-" + i + "-" + n, spot: n,
        status: "soon", name: ""}))
    }));
    renderSpots();
    return;
  }
  // המקום שלי מגיע כבר בתשובה של list, בלי נסיעה שנייה לשרת
  const token = linkToken || recall();
  if(token && listRes.mine && listRes.mine.status === "claimed"){
    myToken = token; remember(token);
    const hit = findSpot(listRes.mine.id);
    if(hit) hit.spot.mine = true;
  }else if(token && listRes.mine === null){
    forget();
  }
  renderSpots();
  primeArchive();
  setTimeout(() => loadArchive(false), 400);   // טעינה מוקדמת בשקט
}

/* ── טופס ─────────────────────────────────────────────────── */
function renderForm(spot, game){
  onList = false;
  const me = loadMe();
  openModal(
    "<h2>הפרטים שלכם</h2>" +
    '<div class="sub">' + esc(game.day) + " " + esc(game.start) + " עד " + esc(game.end) +
      " · " + esc(game.date) + "</div>" +
    '<div class="fields">' +
      '<div class="f"><label for="nm">שם</label>' +
        '<input id="nm" type="text" autocomplete="name" enterkeyhint="next" placeholder="שם פרטי ומשפחה" value="' + esc(me.name || "") + '"></div>' +
      '<div class="f"><label for="ph">טלפון</label>' +
        '<input id="ph" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" placeholder="050-000-0000" value="' + esc(me.phone || "") + '"></div>' +
    "</div>" +
    '<div class="hint" id="hint">' + (me.phone ? "הפרטים מהפעם הקודמת. אפשר לאשר." : "רק מהמספר הזה אפשר יהיה לשחרר את המקום.") + "</div>" +
    '<button class="filled" id="go">תפיסת המקום</button>' +
    '<button class="plain" id="back">ביטול</button>');

  const hint = document.getElementById("hint");
  const nm = document.getElementById("nm"), ph = document.getElementById("ph");
  document.getElementById("back").onclick = () => { closeModal(); renderSpots(); };
  ph.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  document.getElementById("go").onclick = submit;

  function bad(msg, el){
    hint.className = "hint";            // מאפסים כדי שהאנימציה תרוץ שוב
    void hint.offsetWidth;
    hint.className = "hint bad";
    hint.textContent = msg;
    if(el){
      el.classList.add("field-bad");
      el.addEventListener("input", () => el.classList.remove("field-bad"), {once:true});
      el.focus();
    }
    try{ navigator.vibrate && navigator.vibrate([12, 60, 12]); }catch(e){}
  }

  async function submit(){
    const name = nm.value.trim().replace(/\s+/g, " "), phone = ph.value.trim();
    // דורשים שם פרטי ומשפחה, אחרת אי אפשר לדעת מי זה
    const parts = name.split(" ").filter(w => w.length >= 2);
    if(parts.length < 2){
      return bad("צריך שם פרטי ושם משפחה, כדי שנדע מי נרשם.", nm);
    }
    if(phone.replace(/\D/g, "").length < 9) return bad("מספר הטלפון לא תקין.", ph);

    busy(document.getElementById("go"), true);

    // בדיקה מקומית לפני שמתחילים: אם כבר יש לו מקום במשחק הזה,
    // לא מציגים "תופסים" ואז מתהפכים. אומרים לו מיד ולמה.
    const already = game.spots.find(x =>
      x.status === "claimed" &&
      (x.mine || nameKey(x.name) === nameKey(name)));
    if(already){
      return bad(already.mine
        ? "כבר תפסתם מקום במשחק הזה. אפשר להירשם למשחק אחר."
        : "השם הזה כבר רשום למשחק הזה. אפשר להירשם למשחק אחר.", nm);
    }

    saveMe(name, phone);

    if(demoMode){
      spot.status = "claimed"; spot.name = name; spot.mine = true;
      myToken = "demo"; saveDemo();
      return renderDone(name, null, game);
    }

    // תופסים מיד על המסך, ומאשרים מול השרת ברקע.
    // אם מישהו הקדים, חוזרים אחורה ואומרים את זה ברור.
    const before = {status: spot.status, name: spot.name, mine: spot.mine};
    spot.status = "claimed"; spot.name = name; spot.mine = true;
    renderDone(name, null, game, true);

    try{
      const res = await api("claim", {slot: spot.id, name: name, phone: phone});
      if(res && res.ok){
        myToken = res.token; remember(res.token);
        return confirmSaved(res.token);
      }
      // לא הצליח: מחזירים את המצב הקודם ומסבירים
      Object.assign(spot, before);
      if(res && res.games) games = normalise(res.games);
      closeModal();
      renderSpots(
        !res ? "לא הצלחנו לשמור. נסו שוב." :
        res.reason === "taken"          ? "מישהו הקדים אתכם בשנייה. נסו מקום אחר." :
        res.reason === "game_closed"    ? "המשחק הזה כבר התחיל." :
        res.reason === "need_full_name" ? "צריך שם פרטי ושם משפחה." :
        res.reason === "already_booked"
          ? (res.held
              ? "המקום לא נתפס. כבר יש לכם מקום ב" + res.held.day + " " +
                res.held.start + ", ואפשר לתפוס רק אחד בכל משחק."
              : "המקום לא נתפס. כבר תפסתם מקום במשחק הזה.") :
                                          "לא הצלחנו לשמור. נסו שוב.");
    }catch(err){
      Object.assign(spot, before);
      closeModal();
      renderSpots("שגיאה. המקום לא נשמר, נסו שוב.");
    }
  }
}

function confirmRelease(btn){
  openModal(
    "<h2>לשחרר את המקום?</h2>" +
    '<div class="sub">המקום ייפתח מיד לשאר העובדים.</div>' +

async function releaseSpot(btn){
  busy(btn, true);
  if(!demoMode){
    try{ await api("cancel", {token: myToken}); }
    catch(e){ busy(btn, false); return; }
  }
  forget(); myToken = null;
  games.forEach(g => g.spots.forEach(sp => {
    if(sp.mine){ sp.mine = false; sp.status = "open"; sp.name = ""; }
  }));
  saveDemo(); closeModal();
  renderSpots("המקום שוחרר ונפתח מחדש.");
}

}

/* ── שחרור מקום של מי שנרשם, לפי הטלפון שאיתו נרשם ────────── */
function renderRelease(spot){
  onList = false;
  const me = loadMe();
  openModal(
    "<h2>שחרור המקום</h2>" +
    '<div class="sub">' + esc(spot.name) + "</div>" +
    '<div class="fields">' +
      '<div class="f"><label for="rp">טלפון</label>' +
        '<input id="rp" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" ' +
        'placeholder="050-000-0000" value="' + esc(me.phone || "") + '"></div>' +
    "</div>" +
    '<div class="hint" id="rhint">רק המספר שאיתו נתפס המקום יכול לשחרר אותו.</div>' +
    '<button class="filled" id="rgo">שחרור המקום</button>' +
    '<button class="plain" id="rback">ביטול</button>');

  const hint = document.getElementById("rhint"), rp = document.getElementById("rp");
  document.getElementById("rback").onclick = () => { closeModal(); renderSpots(); };
  rp.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  document.getElementById("rgo").onclick = go;

  async function go(){
    const phone = rp.value.trim();
    // 4 ספרות = קוד מנהל, אחרת צריך טלפון מלא. הבדיקה האמיתית בשרת.
    if(phone.length !== 4 && phone.replace(/\D/g, "").length < 9){
      hint.className = "hint bad"; hint.textContent = "מספר הטלפון לא תקין."; rp.focus(); return;
    }
    const btn = document.getElementById("rgo");
    busy(btn, true);

    if(demoMode){
      spot.status = "open"; spot.name = ""; spot.mine = false;
      saveDemo(); closeModal();
      return renderSpots("המקום שוחרר.");
    }
    try{
      const res = await api("release", {slot: spot.id, phone: phone});
      if(res.ok){
        if(spot.mine){ forget(); myToken = null; }
        const list = await api("list");
        games = normalise(list.games);
        closeModal();
        return renderSpots("המקום שוחרר ונפתח מחדש.");
      }
      busy(btn, false);
      hint.className = "hint";
      void hint.offsetWidth;
      hint.className = "hint bad";
      hint.textContent = res.reason === "phone_mismatch"
        ? "המספר הזה לא תופס את המקום הזה."
        : "לא הצלחנו לשחרר. נסו שוב.";
      try{ navigator.vibrate && navigator.vibrate([12, 60, 12]); }catch(e){}
    }catch(e){
      busy(btn, false);
      hint.className = "hint bad"; hint.textContent = "שגיאה, נסו שוב.";
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   כל החלונות הם אותו רכיב: אותו כרטיס, אותה ידית, אותה גרירה
   כלפי מטה לסגירה. פרטים, ביטול ולוח המשחקים נראים זהה.
   ══════════════════════════════════════════════════════════════ */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let weekLog = null, board = null, tab = "log";
let cardY = 0, cardH = 0, raf = null, dragging = false;
let dragStartY = 0, dragStartOffset = 0, dragPts = [];

function cardEl(){ return modal.querySelector(".card"); }

function setY(y){
  const c = cardEl();
  if(!c) return;
  cardY = y;
  c.style.transform = "translateY(" + y + "px)";
  mscrim.style.opacity = String(Math.max(0, 1 - y / (cardH || 1)));
}

/* קפיץ שמתחיל מהמצב שעל המסך, כדי שאפשר לתפוס אותו באמצע תנועה */
function springTo(target, velocity, done){
  if(raf) cancelAnimationFrame(raf);
  if(reduced){ setY(target); done && done(); return; }
  let v = velocity || 0, last = performance.now();
  const k = 420, c = 41;
  const step = now => {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    v += ((-k * (cardY - target)) - c * v) * dt;
    setY(cardY + v * dt);
    if(Math.abs(cardY - target) < 0.5 && Math.abs(v) < 15){
      setY(target); raf = null; done && done(); return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

const project = v => (v / 1000) * 0.998 / (1 - 0.998);
const rubber  = (over, dim) => (over * dim * 0.55) / (dim + 0.55 * Math.abs(over));

modal.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".grab");
  if(!handle) return;
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  if(raf) cancelAnimationFrame(raf);
  dragging = true;
  cardH = cardEl().offsetHeight;
  dragStartY = e.clientY;
  dragStartOffset = cardY;
  dragPts = [{y: e.clientY, t: performance.now()}];
});

modal.addEventListener("pointermove", e => {
  if(!dragging) return;
  let next = dragStartOffset + (e.clientY - dragStartY);
  if(next < 0) next = -rubber(-next, cardH);
  setY(next);
  dragPts.push({y: e.clientY, t: performance.now()});
  if(dragPts.length > 6) dragPts.shift();
});

function endDrag(){
  if(!dragging) return;
  dragging = false;
  const last = dragPts[dragPts.length - 1];
  let first = dragPts[0], velocity = 0;
  for(let i = dragPts.length - 1; i >= 0; i--){
    if(last.t - dragPts[i].t >= 25){ first = dragPts[i]; break; }
  }
  const dt = last.t - first.t;
  if(dt >= 25) velocity = (last.y - first.y) / dt * 1000;
  velocity = Math.max(-4000, Math.min(4000, velocity));

  // ההטלה מוגבלת לגובה הכרטיס, אחרת גרירה קצרה הייתה סוגרת לבד
  const landing = cardY + Math.min(project(velocity), cardH);
  if(velocity > 550 || landing > cardH * 0.55){
    springTo(cardH || 420, velocity, () => { closeModal(); renderSpots(); });
  }else{
    springTo(0, velocity);
  }
}
modal.addEventListener("pointerup", endDrag);
modal.addEventListener("pointercancel", endDrag);

/* ── לוח המשחקים, באותו חלון ──────────────────────────────── */
const MEDAL = ["g", "s", "b"];

        "</div>").join("") + "</div>"

        '<div class="lb' + (i < 3 ? " podium" : "") + '" style="--i:' + i + '">' +
          '<span class="medal ' + (MEDAL[i] || "n") + '">' + (i + 1) + "</span>" +
          '<span class="lb-name">' + esc(p.name) + "</span>" +
          '<span class="lb-n">' + p.games + "<small>משחקים</small></span>" +
        "</div>").join("") + "</div>"

  openModal(boardHTML(), {tall:true});
});

/* הלוח נמשך פעם אחת ברקע ונשמר במכשיר, כך שלחיצה עליו
   פותחת אותו מיד ולא מתחילה המתנה חדשה. */
async function loadArchive(render){
  if(demoMode){ weekLog = DEMO_HISTORY; board = DEMO_BOARD; return render && renderBoard(); }
  try{
    const res = await api("extras");
    if(res && res.ok){
      weekLog = res.weeks || [];
      board   = res.board || [];
      try{ localStorage.setItem(XSNAP, JSON.stringify({t: Date.now(), w: weekLog, b: board})); }catch(e){}
    }else{ weekLog = weekLog || []; board = board || []; }
  }catch(e){ weekLog = weekLog || []; board = board || []; }
  if(render) renderBoard();
}

/* מה שנשמר בפעם הקודמת, כדי שהלוח ייפתח מיד */
function primeArchive(){
  try{
    const raw = JSON.parse(localStorage.getItem(XSNAP));
    if(raw && Date.now() - raw.t < 864e5){ weekLog = raw.w; board = raw.b; }
  }catch(e){}
}

document.getElementById("remindMe").onclick = calendarForNextOpening;

document.getElementById("openLog").onclick = () => {
  renderBoard();                    // נפתח מיד עם מה שיש
  loadArchive(true);                // ומתעדכן ברקע
};

/* ── רענון שקט ─────────────────────────────────────────────
   הדף פתוח אצל הרבה עובדים בו זמנית. כל 20 שניות, וגם כשחוזרים
   ללשונית, מושכים את המצב העדכני כדי שלא יראו מקום שכבר נתפס.
   הרענון מדלג כשהמשתמש באמצע טופס.                          */
let onList = false;

async function refresh(){
  if(!onList || demoMode || document.hidden) return;
  try{
    const res = await api("list");
    if(!res || !res.ok) return;
    const mineId = (() => {
      for(const g of games){ const sp = g.spots.find(x => x.mine); if(sp) return sp.id; }
      return null;
    })();
    const fresh = normalise(res.games);
    if(JSON.stringify(fresh) === JSON.stringify(games.map(g =>
       Object.assign({}, g, {spots: g.spots.map(x => Object.assign({}, x, {mine:false}))})))) return;
    games = fresh;
    if(mineId){ const hit = findSpot(mineId); if(hit) hit.spot.mine = true; }
    renderSpots();
  }catch(e){ /* רענון שקט */ }
}

setInterval(refresh, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });

/* במצב דמו אין שרת, אז המצב נשמר במכשיר עצמו. ככה הזמנה שורדת
   רענון ואפשר להדגים בלי שזה ייראה שבור. בין מכשירים אין קשר,
   וזה בדיוק מה שהחיבור לגיליון פותר. */
function loadDemo(){
  try{
    const saved = JSON.parse(localStorage.getItem(DSTATE));
    if(Array.isArray(saved) && saved.length === DEMO_GAMES.length) return saved;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEMO_GAMES));
}
function saveDemo(){
  if(!demoMode) return;
  try{ localStorage.setItem(DSTATE, JSON.stringify(games)); }catch(e){}
}

/* ── בהיר ככברירת מחדל, והמתג שומר את הבחירה במכשיר ───────── */
(function theming(){
  const KEY = "padel-glilot-theme";
  const btn = document.getElementById("theme");
  let mode = "light";
  try{ mode = localStorage.getItem(KEY) || "light"; }catch(e){}

  function apply(m){
    document.documentElement.setAttribute("data-theme", m);
    if(btn) btn.setAttribute("aria-label", m === "dark" ? "מצב בהיר" : "מצב כהה");
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", m === "dark" ? "#0B0B0B" : "#EDEDEB");
  }
  apply(mode);

  if(btn) btn.addEventListener("click", () => {
    mode = mode === "dark" ? "light" : "dark";
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    apply(mode);
  });
})();

(async function start(){
  paintHero();

  // מציגים מיד את מה שהיה בפעם הקודמת, כדי שלא יראו מסך ריק
  const snap = loadSnap();
  if(snap && accessCode && API.indexOf("PASTE_") !== 0){
    games = normalise(snap);
    renderSpots();
  }
  if(API.indexOf("PASTE_") === 0){
    demoMode = true;
    games = loadDemo();
    renderSpots();
    return;
  }
  try{
    const token = linkToken || recall();
    const res = await api("list", token ? {token: token} : {});
    if(res && res.ok) return boot(res);
    if(res && res.reason === "bad_code") return renderGate(accessCode ? "הקוד לא נכון." : "");
    fail();
  }catch(err){
    fail();
  }
})();
</script>
