<head>

<title>פאדל גלילות</title>

<meta name="theme-color" content="#EDEDEB">
<link rel="icon" type="image/png" sizes="32x32" href="/portfolio-images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/portfolio-images/favicon-192.png">

<style>
/* ══════════════════════════════════════════════════════════════
   צבע מותג אחד: האדום של BIG. משנים כאן והכל משתנה איתו.
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink:#E4002B;            /* אדום BIG */
  --ink-press:#B4001F;
  --on-ink:#FFFFFF;

  --bg:#EDEDEB;
  --card:#FFFFFF;
  --text:#0B0B0B;
  --text-2:#6F6F6C;
  --text-3:#A5A5A1;
  --line:#E2E2DF;
  --fill-hover:rgba(0,0,0,.035);

  --r-block:12px;
  --r-pill:9px;
  --r-round:999px;   /* למדליות ולמתג בלבד */
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FF3355; --ink-press:#E01238; --on-ink:#FFFFFF;
    --bg:#0B0B0B; --card:#161615; --text:#F5F5F3; --text-2:#9C9C98; --text-3:#6B6B67;
    --line:#262625; --fill-hover:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --ink:#FF3355; --ink-press:#E01238; --on-ink:#FFFFFF;
  --bg:#0B0B0B; --card:#161615; --text:#F5F5F3; --text-2:#9C9C98; --text-3:#6B6B67;
  --line:#262625; --fill-hover:rgba(255,255,255,.05);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:400 17px/1.35 var(--font);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
h1,h2{margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;
  -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

.wrap{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:0 14px;position:relative}

/* על מסך גדול נשארים ברוחב טלפון, אבל בתוך מסגרת נקייה */
@media (min-width:560px){
  body{padding:32px 0}
  .credit{margin-top:18px}
  .wrap{min-height:auto;background:var(--bg);border-radius:16px;padding:0 16px 8px;
    backdrop-filter:blur(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 24px 60px -28px rgba(0,0,0,.35);
    outline:1px solid var(--line)}
}

/* ── רקע: קווי מגרש וכדורים, שקטים מאחורי הכל ─────────────── */
.court-bg{position:fixed;inset:-2%;z-index:-2;color:var(--text);opacity:.075;
  pointer-events:none}
.court-bg svg{width:100%;height:100%}
.court-bg .balls{opacity:.85}
:root[data-theme="dark"] .court-bg{opacity:.1}

/* ── סרגל מותג ────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;padding:16px 6px 14px}
.bar-txt{font-size:12.5px;font-weight:600;color:var(--text-2);flex:1;min-width:0}

/* הלוגו של BIG FASHION גלילות */
.logo{height:46px;width:auto;flex:none;display:block;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* מתג מצב כהה */
.theme{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:var(--r-pill);
  color:var(--text-2);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .12s ease,color .15s ease}
.theme:active{transform:scale(.92)}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}

/* ── בלוק המשחק, עם קווי המגרש ברקע ──────────────────────── */
.hero{background:var(--ink);color:var(--on-ink);border-radius:var(--r-block);
  padding:20px 22px 22px;position:relative;overflow:hidden;isolation:isolate}
.hero > *{position:relative}
.court{position:absolute;z-index:-1;inset:auto -12% -18% auto;width:118%;height:auto;
  opacity:.17;color:currentColor;transform:rotate(-7deg);pointer-events:none}
@media (prefers-reduced-motion: no-preference){
  .court{animation:court 1.1s var(--ease) both}
}
@keyframes court{from{opacity:0;transform:rotate(-7deg) scale(1.08)}
  to{opacity:.17;transform:rotate(-7deg) scale(1)}}
.hero .day{font-size:13px;font-weight:600;opacity:.6;letter-spacing:.01em}
.hero .time{font-size:62px;font-weight:700;letter-spacing:-.05em;line-height:.95;
  margin-top:8px;font-variant-numeric:tabular-nums}
.hero .court{margin-top:9px;font-size:14px;opacity:.6}
.hero .left{margin-top:11px;font-size:14px;font-weight:600;opacity:.85}

/* ── רשימת השחקנים ────────────────────────────────────────── */
.group{margin:22px 6px 8px;font-size:12.5px;color:var(--text-2);font-weight:600}
.list{background:var(--card);border-radius:var(--r-block);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:62px;padding:11px 18px;position:relative}
.row + .row::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.who{flex:1;min-width:0;font-size:19px;font-weight:600;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row[data-state="open"] .who{color:var(--text-3);font-weight:500}
.tag{font-size:13px;color:var(--text-3);font-weight:600}
.tag.mine{color:var(--ink);font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:var(--r-pill);padding:5px 11px}

.take.free{background:transparent;color:var(--ink);font-size:13.5px;
  box-shadow:inset 0 0 0 1.5px var(--ink)}
.take.free:active{background:transparent;color:var(--ink-press)}
.sure{display:flex;align-items:center;gap:7px;animation:in .28s var(--ease) both}
.sure span{font-size:13.5px;font-weight:700;color:var(--text-2)}
.sure-yes,.sure-no{font-size:13.5px;font-weight:800;padding:9px 14px;
  border-radius:var(--r-pill);min-height:38px;transition:transform .1s ease}
.sure-yes{background:var(--ink);color:var(--on-ink)}
.sure-no{color:var(--text-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.sure-yes:active,.sure-no:active{transform:scale(.94)}
.tag.as-btn{cursor:pointer;transition:opacity .15s ease}
.tag.as-btn:active{opacity:.45}
.take{background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:700;
  padding:10px 16px;border-radius:var(--r-pill);min-height:40px;
  transition:transform .1s ease,opacity .15s ease}
.take:active{transform:scale(.95);background:var(--ink-press)}
@media (hover:hover){
  .row[data-state="open"],.row[data-state="claimed"],.row[data-state="mine"]{cursor:pointer}
  .row:hover{background:var(--fill-hover)}
  .row[data-state="open"]:hover .take{background:var(--ink-press)}
  .row[data-state="open"]:hover .who{color:var(--text)}
  .filled:hover,.hollow:hover,.seg:hover,.theme:hover{filter:brightness(.97)}
  .theme:hover{color:var(--text)}
}

@media (prefers-reduced-motion: no-preference){
  .list .row{animation:in .42s var(--ease) both;animation-delay:calc(var(--i) * 50ms)}
  .mk{animation:pop .45s var(--ease) both}
}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

/* ── כפתורים ──────────────────────────────────────────────── */
.filled{width:100%;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:700;
  min-height:56px;border-radius:var(--r-pill);margin-top:18px;
  transition:transform .1s ease,opacity .15s ease}
.filled:active{transform:scale(.985);background:var(--ink-press)}
.filled:disabled{opacity:.35;transform:none;cursor:default}
.hollow{width:100%;background:transparent;color:var(--text);font-size:16px;font-weight:600;
  min-height:52px;border-radius:var(--r-pill);margin-top:10px;
  box-shadow:inset 0 0 0 1.5px var(--line)}
.hollow:active{background:var(--card)}
.plain{width:100%;color:var(--text-2);font-size:15px;font-weight:600;min-height:44px;margin-top:6px}
.plain:active{opacity:.5}

/* ── שער הכניסה. הקוד נבדק בשרת, לא בדף. ──────────────────── */
function renderGate(msg){
  document.getElementById("openLog").hidden = true;
  app.innerHTML =
    '<div class="gate">' +
      "<h2>קוד כניסה</h2>" +
      '<p>הקוד מחולק לעובדי הקניון.</p>' +
      '<input id="code" class="code-in" type="text" inputmode="numeric" ' +
        'maxlength="4" autocomplete="one-time-code" placeholder="0000">' +
      (msg ? '<div class="hint bad" style="margin:10px 2px 0">' + esc(msg) + "</div>" : "") +
      '<button class="filled" id="enter">כניסה</button>' +
    "</div>";
  const input = document.getElementById("code");
  setTimeout(() => input.focus(), 80);
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    if(input.value.length === 4) enter();
  });
  document.getElementById("enter").onclick = enter;

  async function enter(){
    const v = input.value.trim();
    if(v.length !== 4) return;
    const btn = document.getElementById("enter");
    btn.disabled = true; btn.textContent = "בודקים";
    accessCode = v;
    try{
      const res = await api("list");
      if(res && res.ok){
        try{ localStorage.setItem(CODE, v); }catch(e){}
        document.getElementById("openLog").hidden = false;
        return boot(res);
      }
      accessCode = "";
      renderGate("הקוד לא נכון.");
    }catch(e){
      accessCode = "";
      renderGate("אין חיבור לשרת.");
    }
  }
}

/* ── חלון קטן במקום החלפת מסך ─────────────────────────────── */
const modal  = document.getElementById("modal");
const mscrim = document.getElementById("mscrim");

function openModal(html, opts){
  opts = opts || {};
  modal.innerHTML = '<div class="card' + (opts.tall ? " tall" : "") + '">' +
    '<div class="grab" aria-hidden="true"><i></i></div>' + html + "</div>";
  modal.hidden = false; mscrim.hidden = false;
  cardY = 0; mscrim.style.opacity = "1";
  const c = modal.querySelector(".card");
  if(c){ c.style.transform = "translateY(0px)"; cardH = c.offsetHeight; }
  const first = modal.querySelector("input");
  if(first) setTimeout(() => first.focus(), 60);
}
function closeModal(){
  modal.hidden = true; mscrim.hidden = true; modal.innerHTML = "";
}
mscrim.addEventListener("click", () => { closeModal(); renderSpots(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !modal.hidden){ closeModal(); renderSpots(); }
});

/* ── טופס ─────────────────────────────────────────────────── */
.fields{background:var(--card);border-radius:var(--r-block);overflow:hidden}
.f{display:flex;align-items:center;gap:12px;padding:6px 18px;position:relative}
.f + .f::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.f label{width:64px;flex:none;font-size:14px;color:var(--text-2);font-weight:600}
.f input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:600;border:0;
  background:transparent;color:var(--text);padding:16px 0;min-height:52px;letter-spacing:-.01em}
.f input::placeholder{color:var(--text-3);font-weight:500}
.f input:focus{outline:none}
.hint{margin:9px 6px 0;font-size:13px;color:var(--text-2);line-height:1.4}
.hint.bad{color:var(--text);font-weight:600}

/* ── מסך אישור ────────────────────────────────────────────── */
.done{padding:8px 6px 0}
.mk{width:54px;height:54px;border-radius:var(--r-round);background:var(--ink);color:var(--on-ink);
  display:grid;place-items:center;font-size:26px;font-weight:600}
.done h2{margin-top:18px;font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.02}
@media (prefers-reduced-motion: no-preference){
  .done h2{animation:in .5s var(--ease) both;animation-delay:.08s}
  .done p{animation:in .5s var(--ease) both;animation-delay:.16s}
  .done .filled{animation:in .5s var(--ease) both;animation-delay:.24s}
}
.done p{margin-top:12px;font-size:16px;color:var(--text-2);line-height:1.45;max-width:31ch}

/* ── שלד טעינה ────────────────────────────────────────────── */
.sk{min-height:62px;padding:22px 18px;position:relative}
.sk + .sk::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.sk i{display:block;width:132px;height:18px;border-radius:5px;background:var(--line)}
@media (prefers-reduced-motion: no-preference){
  .sk i{animation:breathe 1.4s ease-in-out infinite}
}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}

/* ── חלון: אותו כרטיס לכל המסכים ──────────────────────────── */
.mscrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{position:fixed;z-index:61;inset-inline:0;bottom:0;padding:0 12px 12px;
  display:flex;justify-content:center;pointer-events:none}
.modal .card{pointer-events:auto}
@media (min-height:620px){
  .modal{top:0;align-items:center;padding:16px 12px}
}
.card{width:100%;max-width:398px;background:var(--bg);border-radius:14px;
  padding:14px 18px 20px;box-shadow:0 24px 60px -18px rgba(0,0,0,.55);
  outline:1px solid var(--line);will-change:transform}
.card h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
.card.tall{padding:14px 14px 16px}
.grab{padding:2px 0 12px;display:grid;place-items:center;touch-action:none;cursor:grab;
  margin:0 -18px 2px}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--text-3);opacity:.5;display:block}
.grab:active{cursor:grabbing}
.card .sub{margin-top:4px;font-size:13.5px;color:var(--text-2);font-weight:600}
.scroller{max-height:min(52dvh,400px);overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
.segs{display:flex;gap:5px;margin:0 0 10px}
.seg{flex:1;font-size:14px;font-weight:700;color:var(--text-2);padding:9px 10px;
  border-radius:var(--r-pill);background:var(--card);
  transition:background .18s ease,color .18s ease,transform .1s ease}
.seg[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.seg:active{transform:scale(.97)}
@media (prefers-reduced-motion: no-preference){
  .mscrim{animation:fade .2s ease both}
  .card{animation:rise .32s var(--ease) both}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ── לוג השבועות והמובילים ────────────────────────────────── */

.wk{padding:14px 18px;position:relative}
.wk + .wk::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.wk-date{font-size:12.5px;color:var(--text-3);font-weight:600;
  font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:start}
.wk-names{margin-top:5px;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.4}

.lb{display:flex;align-items:center;gap:12px;padding:13px 18px;position:relative}
.lb + .lb::before{content:"";position:absolute;top:0;inset-inline-start:18px;inset-inline-end:0;
  height:1px;background:var(--line)}
.lb-rank{font-size:13px;color:var(--text-3);font-weight:700;min-width:16px;
  font-variant-numeric:tabular-nums}
.lb-name{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lb-n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.lb.top .lb-name,.lb.top .lb-n{font-weight:700}
.empty{padding:20px 18px;font-size:14px;color:var(--text-3)}

.credit{padding:26px 6px 22px;margin-top:auto;text-align:center;font-size:11.5px;
  color:var(--text-3)}
.credit a{color:var(--text-3);text-decoration:none;font-variant-numeric:tabular-nums;
  direction:ltr;unicode-bidi:isolate}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════

const API = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

/* ══════════════════════════════════════════════════════════════
   2. המשחק הקבוע. אותם ערכים גם ב־SESSION שבקובץ Code.gs.
   ══════════════════════════════════════════════════════════════ */
const GAME = {
  day:        "ראשון",       // חייב להיות זהה ל־SESSION שב־Code.gs
  time:       "18:00",
  court:      "מגרש הפאדל",
  place:      "ביג פאשן גלילות",
  resetAfter: 2              // דקות אחרי המשחק שבהן נפתח השבוע הבא
};

const app    = document.getElementById("app");
const leftEl = {set textContent(v){}};   /* המונה מוצג מעל הרשימה בלבד */
const params = new URLSearchParams(location.search);
const linkToken = params.get("c");
const STORE = "padel-glilot-token";
const CODE  = "padel-glilot-code";
const ME    = "padel-glilot-me";

let spots = [], demoMode = false, myToken = null;
let accessCode = "";
try{ accessCode = localStorage.getItem(CODE) || ""; }catch(e){}

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const remember = t => { try{ localStorage.setItem(STORE, t); }catch(e){} };
const recall   = ()  => { try{ return localStorage.getItem(STORE); }catch(e){ return null; } };
const forget   = ()  => { try{ localStorage.removeItem(STORE); }catch(e){} };

/* פרטי העובד נשמרים במכשיר שלו בלבד, כדי שבפעם הבאה הטופס כבר מלא. */
const saveMe = (name, phone) => {
  try{ localStorage.setItem(ME, JSON.stringify({name:name, phone:phone})); }catch(e){}
};
const loadMe = () => {
  try{ return JSON.parse(localStorage.getItem(ME)) || {}; }catch(e){ return {}; }
};

/* JSONP, כדי שלא תידרש הגדרת CORS בצד של Apps Script. */
function api(action, data){
  data = data || {};
  return new Promise((resolve, reject) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const cleanup = () => { delete window[cb]; s.remove(); clearTimeout(timer); };
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    window[cb] = res => { cleanup(); resolve(res); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    const q = Object.assign({action:action, callback:cb}, data);
    if(accessCode) q.code = accessCode;
    s.src = API + "?" + new URLSearchParams(q).toString();
    document.body.appendChild(s);
  });
}

const DAYS = {"ראשון":0,"שני":1,"שלישי":2,"רביעי":3,"חמישי":4,"שישי":5,"שבת":6};

/* מתי המשחק הקרוב בפועל. אותו כלל כמו בשרת: אחרי שעת המשחק
   ועוד resetAfter דקות, עוברים לשבוע הבא. */
function nextGame(){
  const now = new Date();
  const parts = GAME.time.split(":");
  const d = new Date(now);
  d.setHours(Number(parts[0]) || 0, Number(parts[1]) || 0, 0, 0);
  d.setDate(d.getDate() + (((DAYS[GAME.day] || 0) - d.getDay() + 7) % 7));
  if(now > new Date(d.getTime() + GAME.resetAfter * 60000)) d.setDate(d.getDate() + 7);
  return d;
}
const dm = d => d.getDate() + "." + (d.getMonth() + 1);

/* ── קובץ יומן אחד שמתאים לאייפון, לאנדרואיד ולגוגל ────────── */
function pad2(n){ return String(n).padStart(2, "0"); }
function stamp(d){
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) +
         "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
}
function addToCalendar(opts){
  const end = new Date(opts.start.getTime() + (opts.minutes || 60) * 60000);
  const alarms = (opts.alarms || []).map(a =>
    ["BEGIN:VALARM",
     "ACTION:DISPLAY",
     "DESCRIPTION:" + a.text,
     "TRIGGER;VALUE=DATE-TIME:" + stamp(a.at),
     "END:VALARM"].join("\r\n"));

  const ics = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//AutoScale//Padel Glilot//HE",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "-padel@autoscalehq.io",
    "DTSTAMP:" + stamp(new Date()),
    "DTSTART:" + stamp(opts.start),
    "DTEND:" + stamp(end),
    "SUMMARY:" + opts.title,
    "LOCATION:" + (opts.place || GAME.place),
    "DESCRIPTION:" + (opts.note || ""),
    ...alarms,
    "END:VEVENT",
    "END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], {type: "text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (opts.file || "padel") + ".ics";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

/* המשחק עצמו: תזכורת ביום המשחק ב־09:00, ועוד אחת ערב קודם ב־18:00 */
function calendarForGame(){
  const start = nextGame();
  const sameDay9 = new Date(start); sameDay9.setHours(9, 0, 0, 0);
  const dayBefore18 = new Date(start);
  dayBefore18.setDate(dayBefore18.getDate() - 1);
  dayBefore18.setHours(18, 0, 0, 0);

  const alarms = [{at: dayBefore18, text: "מחר משחק פאדל בגלילות"}];
  if(sameDay9 < start) alarms.unshift({at: sameDay9, text: "היום משחק פאדל בגלילות"});

  addToCalendar({
    title: "משחק פאדל - ביג גלילות",
    start: start, minutes: 60,
    place: GAME.court + ", " + GAME.place,
    note: "המקום שלכם במגרש. אם לא תוכלו להגיע, שחררו אותו כאן: " + location.href,
    alarms: alarms,
    file: "padel-glilot"
  });
}

/* למי שלא הספיק: תזכורת להירשם רגע לפני שנפתח השבוע הבא */
function calendarForNextOpening(){
  const opens = new Date(nextGame().getTime() + GAME.resetAfter * 60000);
  const remind = new Date(opens.getTime() - 2 * 60000);
  addToCalendar({
    title: "להירשם לפאדל של שבוע הבא",
    start: opens, minutes: 15,
    place: GAME.place,
    note: "המקומות נפתחים עכשיו. מי שראשון תופס: " + location.href,
    alarms: [{at: remind, text: "עוד שתי דקות נפתחת ההרשמה לפאדל"}],
    file: "padel-reminder"
  });
}

function paintHero(){
  document.getElementById("gDay").textContent   = "יום " + GAME.day + " · " + dm(nextGame());
  document.getElementById("gTime").textContent  = GAME.time;

/* ── ארבעת המקומות ────────────────────────────────────────── */
function renderSpots(alertText){
  onList = true;
  const open = spots.filter(s => s.status === "open").length;
  const mine = spots.find(s => s.mine);

  const headline = mine ? "אתם רשומים למשחק"
    : open === 0 ? "המגרש מלא השבוע"
    : open === 1 ? "נשאר מקום אחד"
    : "נשארו " + open + " מקומות";

  app.innerHTML =
    (alertText ? '<div class="hint bad" style="margin:16px 6px 0">' + esc(alertText) + "</div>" : "") +
    '<div class="group">' + esc(headline) + "</div>" +
    '<div class="list">' + spots.map((s, i) => {
      const state = s.mine ? "mine" : s.status;
      return '<div class="row" data-state="' + state + '" style="--i:' + i + '">' +
        '<span class="who">' + (s.status === "open" ? "פנוי" : esc(s.name)) + "</span>" +
        (s.mine ? '<button class="take free" data-drop="1">שחרור המקום שלי</button>'
          : s.status === "open" ? '<button class="take" data-take="' + esc(s.id) + '">אני משחק</button>'
          : '<button class="tag as-btn" data-free="' + esc(s.id) + '">זה אני</button>') +
      "</div>";
    }).join("") + "</div>" +
    "";

  // מי שכבר בפנים מקבל כפתור יומן למשחק, מי שלא מקבל תזכורת להרשמה
  const remind = document.getElementById("remindMe");
  if(remind){
    remind.hidden = !!mine;
    remind.textContent = open === 0
      ? "תזכורת ביומן להרשמה לשבוע הבא"
      : "תזכורת ביומן להרשמה לשבוע הבא";
  }
}

/* ── שער הכניסה. הקוד נבדק בשרת, לא בדף. ──────────────────── */
function renderGate(msg){
  document.getElementById("openLog").hidden = true;
  app.innerHTML =
    '<div class="gate">' +
      "<h2>קוד כניסה</h2>" +
      '<p>הקוד מחולק לעובדי הקניון.</p>' +
      '<input id="code" class="code-in" type="text" inputmode="numeric" ' +
        'maxlength="4" autocomplete="one-time-code" placeholder="0000">' +
      (msg ? '<div class="hint bad" style="margin:10px 2px 0">' + esc(msg) + "</div>" : "") +
      '<button class="filled" id="enter">כניסה</button>' +
    "</div>";
  const input = document.getElementById("code");
  setTimeout(() => input.focus(), 80);
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 4);
    if(input.value.length === 4) enter();
  });
  document.getElementById("enter").onclick = enter;

  async function enter(){
    const v = input.value.trim();
    if(v.length !== 4) return;
    const btn = document.getElementById("enter");
    btn.disabled = true; btn.textContent = "בודקים";
    accessCode = v;
    try{
      const res = await api("list");
      if(res && res.ok){
        try{ localStorage.setItem(CODE, v); }catch(e){}
        document.getElementById("openLog").hidden = false;
        return boot(res);
      }
      accessCode = "";
      renderGate("הקוד לא נכון.");
    }catch(e){
      accessCode = "";
      renderGate("אין חיבור לשרת.");
    }
  }
}

/* ── חלון קטן במקום החלפת מסך ─────────────────────────────── */
const modal  = document.getElementById("modal");
const mscrim = document.getElementById("mscrim");

function openModal(html, opts){
  opts = opts || {};
  modal.innerHTML = '<div class="card' + (opts.tall ? " tall" : "") + '">' +
    '<div class="grab" aria-hidden="true"><i></i></div>' + html + "</div>";
  modal.hidden = false; mscrim.hidden = false;
  cardY = 0; mscrim.style.opacity = "1";
  const c = modal.querySelector(".card");
  if(c){ c.style.transform = "translateY(0px)"; cardH = c.offsetHeight; }
  const first = modal.querySelector("input");
  if(first) setTimeout(() => first.focus(), 60);
}
function closeModal(){
  modal.hidden = true; mscrim.hidden = true; modal.innerHTML = "";
}
mscrim.addEventListener("click", () => { closeModal(); renderSpots(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !modal.hidden){ closeModal(); renderSpots(); }
});

/* ── טופס ─────────────────────────────────────────────────── */
function renderForm(spot){
  onList = false;
  const me = loadMe();
  openModal(
    "<h2>הפרטים שלכם</h2>" +
    '<div class="sub">יום ' + esc(GAME.day) + " " + esc(GAME.time) + " · " + esc(GAME.court) + "</div>" +
    '<div class="fields">' +
      '<div class="f"><label for="nm">שם</label>' +
        '<input id="nm" type="text" autocomplete="name" enterkeyhint="next" placeholder="דנה לוי" value="' + esc(me.name || "") + '"></div>' +
      '<div class="f"><label for="ph">טלפון</label>' +
        '<input id="ph" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" placeholder="050-000-0000" value="' + esc(me.phone || "") + '"></div>' +
    "</div>" +
    '<div class="hint" id="hint">' + (me.phone ? "הפרטים מהפעם הקודמת. אפשר לאשר." : "רק מהמספר הזה אפשר יהיה לשחרר את המקום.") + "</div>" +
    '<button class="filled" id="go">תפיסת המקום</button>' +
    '<button class="plain" id="back">ביטול</button>');

  const hint = document.getElementById("hint");
  const nm = document.getElementById("nm"), ph = document.getElementById("ph");
  document.getElementById("back").onclick = () => { closeModal(); renderSpots(); };
  ph.addEventListener("keydown", e => { if(e.key === "Enter") submit(); });
  document.getElementById("go").onclick = submit;

  function bad(msg, el){ hint.className = "hint bad"; hint.textContent = msg; el.focus(); }

  async function submit(){
    const name = nm.value.trim(), phone = ph.value.trim();
    if(name.length < 2) return bad("צריך שם מלא.", nm);
    if(phone.replace(/\D/g, "").length < 9) return bad("מספר הטלפון לא תקין.", ph);

    const btn = document.getElementById("go");
    btn.disabled = true; btn.textContent = "שומרים";

    saveMe(name, phone);
    if(demoMode){
      spot.status = "claimed"; spot.name = name; spot.mine = true;
      myToken = "demo";
      return renderDone(name, null);
    }
    try{
      const res = await api("claim", {slot: spot.id, name: name, phone: phone});
      if(res.ok){
        myToken = res.token; remember(res.token);
        return renderDone(name, res.token);
      }
      if(res.slots) spots = res.slots.map(s => Object.assign({}, s, {mine:false}));
      renderSpots(
        res.reason === "taken"          ? "מישהו הקדים אתכם. נסו מקום אחר." :
        res.reason === "already_booked" ? "המספר הזה כבר רשום השבוע." :
                                          "לא הצלחנו לשמור. נסו שוב.");
    }catch(err){
      btn.disabled = false; btn.textContent = "תפיסת המקום";
      bad("אין חיבור לשרת. נסו שוב.", nm);
    }
  }
}

/* ── אישור ────────────────────────────────────────────────── */
function renderDone(name, token){
  onList = false;
  try{ navigator.vibrate && navigator.vibrate(14); }catch(e){}
  openModal(
    '<div class="done" style="padding:0">' +
      '<div class="mk" aria-hidden="true">✓</div>' +
      "<h2>המקום שלכם</h2>" +
      "<p>" + esc(name) + ", יום " + esc(GAME.day) + " ב־" + esc(GAME.time) + ".</p>" +
      "<p>אפשר לשחרר את המקום מכאן בכל רגע.</p>" +
      '<button class="filled" id="addCal">הוספה ליומן</button>' +
      '<button class="plain" id="backToSpots">סגירה</button>' +
    "</div>");
  document.getElementById("addCal").onclick = calendarForGame;
  document.getElementById("backToSpots").onclick = () => { closeModal(); renderSpots(); };
}


/* ── ביטול ────────────────────────────────────────────────── */
function confirmRelease(btn){
  openModal(
    "<h2>לשחרר את המקום?</h2>" +
    '<div class="sub">המקום ייפתח מיד לשאר העובדים.</div>' +
    '<button class="filled" id="yes">כן, שחררו</button>' +
    '<button class="plain" id="no">לא</button>');
  document.getElementById("no").onclick  = () => { closeModal(); renderSpots(); };
  document.getElementById("yes").onclick = e => releaseSpot(e.target);
}

async function releaseSpot(btn){
  btn.disabled = true; btn.textContent = "משחררים";
  if(!demoMode){
    try{ await api("cancel", {token: myToken}); }
    catch(e){ btn.disabled = false; btn.textContent = "ביטול ההרשמה שלי"; return; }
  }
  forget(); myToken = null;
  const me = spots.find(x => x.mine);
  if(me){ me.mine = false; me.status = "open"; me.name = ""; }
  closeModal();
  renderSpots("המקום שוחרר ונפתח מחדש.");
}

function fail(){
  leftEl.textContent = "אין חיבור";
  app.innerHTML =
    '<div class="done"><h2>לא נטען</h2>' +
    "<p>תקלת רשת רגעית. נסו לרענן.</p>" +
    '<button class="filled" id="retry">רענון</button></div>';
  document.getElementById("retry").onclick = () => location.reload();
}

/* ── שחרור מקום של מי שנרשם, לפי הטלפון שאיתו נרשם ────────── */
function renderRelease(spot){
  onList = false;
  const me = loadMe();
  openModal(
    "<h2>שחרור המקום</h2>" +
    '<div class="sub">' + esc(spot.name) + "</div>" +
    '<div class="fields">' +
      '<div class="f"><label for="rp">טלפון</label>' +
        '<input id="rp" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="done" ' +
        'placeholder="050-000-0000" value="' + esc(me.phone || "") + '"></div>' +
    "</div>" +
    '<div class="hint" id="rhint">רק המספר שאיתו נתפס המקום יכול לשחרר אותו.</div>' +
    '<button class="filled" id="rgo">שחרור המקום</button>' +
    '<button class="plain" id="rback">ביטול</button>');

  const hint = document.getElementById("rhint"), rp = document.getElementById("rp");
  document.getElementById("rback").onclick = () => { closeModal(); renderSpots(); };
  rp.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
  document.getElementById("rgo").onclick = go;

  async function go(){
    const phone = rp.value.trim();
    // 4 ספרות = קוד מנהל, אחרת צריך טלפון מלא. הבדיקה האמיתית בשרת.
    if(phone.length !== 4 && phone.replace(/\D/g, "").length < 9){
      hint.className = "hint bad"; hint.textContent = "מספר הטלפון לא תקין."; rp.focus(); return;
    }
    const btn = document.getElementById("rgo");
    btn.disabled = true; btn.textContent = "בודקים";

    if(demoMode){
      spot.status = "open"; spot.name = ""; spot.mine = false;
      closeModal();
      return renderSpots("המקום שוחרר.");
    }
    try{
      const res = await api("release", {slot: spot.id, phone: phone});
      if(res.ok){
        if(spot.mine){ forget(); myToken = null; }
        const list = await api("list");
        spots = (list.slots || []).map(x => Object.assign({}, x, {mine:false}));
        closeModal();
        return renderSpots("המקום שוחרר ונפתח מחדש.");
      }
      btn.disabled = false; btn.textContent = "שחרור המקום";
      hint.className = "hint bad";
      hint.textContent = res.reason === "phone_mismatch"
        ? "המספר הזה לא תופס את המקום הזה."
        : "לא הצלחנו לשחרר. נסו שוב.";
    }catch(e){
      btn.disabled = false; btn.textContent = "שחרור המקום";
      hint.className = "hint bad"; hint.textContent = "אין חיבור לשרת.";
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   כל החלונות הם אותו רכיב: אותו כרטיס, אותה ידית, אותה גרירה
   כלפי מטה לסגירה. פרטים, ביטול ולוח המשחקים נראים זהה.
   ══════════════════════════════════════════════════════════════ */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let weekLog = null, board = null, tab = "log";
let cardY = 0, cardH = 0, raf = null, dragging = false;
let dragStartY = 0, dragStartOffset = 0, dragPts = [];

function cardEl(){ return modal.querySelector(".card"); }

function setY(y){
  const c = cardEl();
  if(!c) return;
  cardY = y;
  c.style.transform = "translateY(" + y + "px)";
  mscrim.style.opacity = String(Math.max(0, 1 - y / (cardH || 1)));
}

/* קפיץ שמתחיל מהמצב שעל המסך, כדי שאפשר לתפוס אותו באמצע תנועה */
function springTo(target, velocity, done){
  if(raf) cancelAnimationFrame(raf);
  if(reduced){ setY(target); done && done(); return; }
  let v = velocity || 0, last = performance.now();
  const k = 420, c = 41;
  const step = now => {
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    v += ((-k * (cardY - target)) - c * v) * dt;
    setY(cardY + v * dt);
    if(Math.abs(cardY - target) < 0.5 && Math.abs(v) < 15){
      setY(target); raf = null; done && done(); return;
    }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

const project = v => (v / 1000) * 0.998 / (1 - 0.998);
const rubber  = (over, dim) => (over * dim * 0.55) / (dim + 0.55 * Math.abs(over));

modal.addEventListener("pointerdown", e => {
  const handle = e.target.closest(".grab");
  if(!handle) return;
  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  if(raf) cancelAnimationFrame(raf);
  dragging = true;
  cardH = cardEl().offsetHeight;
  dragStartY = e.clientY;
  dragStartOffset = cardY;
  dragPts = [{y: e.clientY, t: performance.now()}];
});

modal.addEventListener("pointermove", e => {
  if(!dragging) return;
  let next = dragStartOffset + (e.clientY - dragStartY);
  if(next < 0) next = -rubber(-next, cardH);
  setY(next);
  dragPts.push({y: e.clientY, t: performance.now()});
  if(dragPts.length > 6) dragPts.shift();
});

function endDrag(){
  if(!dragging) return;
  dragging = false;
  const last = dragPts[dragPts.length - 1];
  let first = dragPts[0], velocity = 0;
  for(let i = dragPts.length - 1; i >= 0; i--){
    if(last.t - dragPts[i].t >= 25){ first = dragPts[i]; break; }
  }
  const dt = last.t - first.t;
  if(dt >= 25) velocity = (last.y - first.y) / dt * 1000;
  velocity = Math.max(-4000, Math.min(4000, velocity));

  // ההטלה מוגבלת לגובה הכרטיס, אחרת גרירה קצרה הייתה סוגרת לבד
  const landing = cardY + Math.min(project(velocity), cardH);
  if(velocity > 550 || landing > cardH * 0.55){
    springTo(cardH || 420, velocity, () => { closeModal(); renderSpots(); });
  }else{
    springTo(0, velocity);
  }
}
modal.addEventListener("pointerup", endDrag);
modal.addEventListener("pointercancel", endDrag);

/* ── לוח המשחקים, באותו חלון ──────────────────────────────── */
const MEDAL = ["g", "s", "b"];

function boardHTML(){
  const log = (weekLog || []).length
    ? '<div class="list">' + weekLog.map((w, i) =>
        '<div class="wk" style="--i:' + i + '">' +
          '<div class="wk-date">' + esc(w.date) + " · " + esc(w.time || GAME.time) + "</div>" +
          '<div class="wk-names">' + w.players.map(esc).join(", ") + "</div>" +
        "</div>").join("") + "</div>"
    : '<div class="list"><div class="empty">המשחק הראשון עוד לפניכם.</div></div>';

  const lead = (board || []).length
    ? '<div class="list">' + board.map((p, i) =>
        '<div class="lb' + (i < 3 ? " podium" : "") + '" style="--i:' + i + '">' +
          '<span class="medal ' + (MEDAL[i] || "n") + '">' + (i + 1) + "</span>" +
          '<span class="lb-name">' + esc(p.name) + "</span>" +
          '<span class="lb-n">' + p.games + "<small>משחקים</small></span>" +
        "</div>").join("") + "</div>"
    : '<div class="list"><div class="empty">אין עדיין משחקים לספור.</div></div>';

  return '<div class="segs">' +
      '<button class="seg" data-tab="log" aria-selected="' + (tab === "log") + '">לוח משחקים</button>' +
      '<button class="seg" data-tab="board" aria-selected="' + (tab === "board") + '">מובילים</button>' +
    "</div>" +
    '<div class="scroller">' + (tab === "log" ? log : lead) + "</div>";
}

function renderBoard(){
  if(weekLog === null && board === null){
    return openModal('<div class="list"><div class="empty">טוענים</div></div>', {tall:true});
  }
  openModal(boardHTML(), {tall:true});
}

modal.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if(!t) return;
  tab = t.dataset.tab;
  openModal(boardHTML(), {tall:true});
});

async function loadArchive(){
  if(demoMode){ weekLog = DEMO_HISTORY; board = DEMO_BOARD; return renderBoard(); }
  try{
    const res = await Promise.all([
      api("history").catch(() => null),
      api("board").catch(() => null)
    ]);
    weekLog = res[0] && res[0].ok ? res[0].weeks : [];
    board   = res[1] && res[1].ok ? res[1].board : [];
  }catch(e){ weekLog = []; board = []; }
  renderBoard();
}

document.getElementById("remindMe").onclick = calendarForNextOpening;

document.getElementById("openLog").onclick = () => {
  renderBoard();
  if(weekLog === null) loadArchive();
};

/* ── רענון שקט ─────────────────────────────────────────────
   הדף פתוח אצל הרבה עובדים בו זמנית. כל 20 שניות, וגם כשחוזרים
   ללשונית, מושכים את המצב העדכני כדי שלא יראו מקום שכבר נתפס.
   הרענון מדלג כשהמשתמש באמצע טופס.                          */
let onList = false;

async function refresh(){
  if(!onList || demoMode || document.hidden) return;
  try{
    const res = await api("list");
    const fresh = res.slots || [];
    const changed = fresh.length !== spots.length ||
      fresh.some((f, i) => f.status !== spots[i].status || f.name !== spots[i].name);
    if(!changed) return;
    const mineId = (spots.find(x => x.mine) || {}).id;
    spots = fresh.map(x => Object.assign({}, x, {mine: String(x.id) === String(mineId)}));
    renderSpots();
  }catch(e){ /* רענון שקט, לא מפריעים למשתמש */ }
}

setInterval(refresh, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });

/* ── עלייה ────────────────────────────────────────────────── */
const DEMO_HISTORY = [
  {date:"31.8.26", players:["יעל ברקוביץ'","אורי שגב","נועם קפלן","רותם אליאס"]},
  {date:"24.8.26", players:["אורי שגב","תמר בן דוד","נועם קפלן","עידו פרץ"]},
  {date:"17.8.26", players:["יעל ברקוביץ'","עידו פרץ","רותם אליאס","מיכל סבן"]}
];
const DEMO_BOARD = [
  {name:"אורי שגב", games:9},
  {name:"יעל ברקוביץ'", games:7},
  {name:"נועם קפלן", games:6},
  {name:"רותם אליאס", games:4},
  {name:"עידו פרץ", games:3}
];

const DEMO_SPOTS = [
  {id:"d1", spot:1, status:"claimed", name:"יעל ברקוביץ'"},
  {id:"d2", spot:2, status:"claimed", name:"אורי שגב"},
  {id:"d3", spot:3, status:"open",    name:""},

];

/* ── לחיצות ברשימה. כל השורה היא היעד, לא רק הכפתור. ──────── */
app.addEventListener("click", e => {
  if(e.target.closest("[data-sure]")) return;      // האישור מטפל בעצמו

  const drop = e.target.closest("[data-drop]") ||
               (e.target.closest('.row[data-state="mine"]') &&
                e.target.closest(".row").querySelector("[data-drop]"));
  if(drop){ confirmRelease(drop); return; }

  const takeRow = e.target.closest('.row[data-state="open"]');
  if(takeRow){
    const btn = takeRow.querySelector("[data-take]");
    const spot = btn && spots.find(x => String(x.id) === btn.dataset.take);
    if(spot) renderForm(spot);
    return;
  }

  const freeRow = e.target.closest('.row[data-state="claimed"]');
  if(freeRow){
    const btn = freeRow.querySelector("[data-free]");
    const spot = btn && spots.find(x => String(x.id) === btn.dataset.free);
    if(spot) renderRelease(spot);
  }
});

/* ── מצב תצוגה: לבן כברירת מחדל, והמתג שומר את הבחירה ────── */
(function theming(){
  const KEY = "padel-glilot-theme";
  let mode = "light";
  try{ mode = localStorage.getItem(KEY) || "light"; }catch(e){}
  const apply = m => {
    document.documentElement.dataset.theme = m;
    const btn = document.getElementById("theme");
    btn.setAttribute("aria-label", m === "dark" ? "מצב בהיר" : "מצב כהה");
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", m === "dark" ? "#0B0B0B" : "#EDEDEB");
  };
  apply(mode);
  document.getElementById("theme").onclick = () => {
    mode = mode === "dark" ? "light" : "dark";
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    apply(mode);
  };
})();

async function boot(listRes){
  spots = (listRes.slots || []).map(x => Object.assign({}, x, {mine:false}));
  if(!spots.length){
    app.innerHTML = '<div class="done"><h2>עוד לא נפתח משחק</h2>' +
      "<p>המקומות נפתחים כל שבוע אחרי המשחק הקודם.</p></div>";
    return;
  }
  const token = linkToken || recall();
  if(token){
    try{
      const mineRes = await api("lookup", {token: token});
      if(mineRes && mineRes.ok && mineRes.slot.status === "claimed"){
        myToken = token; remember(token);
        const row = spots.find(x => String(x.id) === String(mineRes.slot.id));
        if(row) row.mine = true;
      }else{ forget(); }
    }catch(e){ /* לא חוסמים את הרשימה בגלל בדיקת הקוד האישי */ }
  }
  renderSpots();
}

(async function start(){
  if(API.indexOf("PASTE_") === 0){
    demoMode = true;
    spots = DEMO_SPOTS.map(x => Object.assign({}, x));
    renderSpots();
    return;
  }
  try{
    const res = await api("list");
    if(res && res.ok) return boot(res);
    if(res && res.reason === "bad_code") return renderGate(accessCode ? "הקוד לא נכון." : "");
    fail();
  }catch(err){
    fail();
  }
})();
</script>
